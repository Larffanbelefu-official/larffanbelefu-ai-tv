<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LARFFAN BELEFU AI RADIO V10</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DV9ZF298TQ"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-DV9ZF298TQ');</script>
<style>
body{background:#050505;color:#fff;font-family:Arial;margin:0;padding:15px;display:flex;justify-content:center}
.device{width:100%;max-width:480px;background:#151515;border:4px solid #333;border-radius:22px;padding:18px}
.top{background:#0c1a0c;border-radius:14px;padding:14px;border:3px solid #008751;text-align:center}
.flagBig{font-size:48px;animation:flow 1.2s infinite alternate}
@keyframes flow{0%{transform:scale(1) translateY(0)}100%{transform:scale(1.15) translateY(-4px)}}
.countryName{font-weight:900;font-size:14px;color:#00ff88}
.artist{color:#7CFC7C;font-size:21px;line-height:1.2;min-height:55px;font-weight:900}
.bars{display:flex;gap:2px;height:45px;margin-top:8px;align-items:flex-end}
.bar{flex:1;background:linear-gradient(to top,#00ff66,#aaffaa);border-radius:3px;animation:bounce .6s infinite alternate;animation-play-state:paused}
@keyframes bounce{0%{height:8%}100%{height:100%}}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.btn{background:#222;border:2px solid #444;border-radius:12px;color:#ccc;padding:12px;font-weight:700;font-size:12px;cursor:pointer}
.btn-play{background:#00ff66;color:#000;min-width:90px}
.btn-mic{background:gold;color:#000;min-width:130px}
.btn-mic.listening{background:red;color:#fff}
.status{text-align:center;color:#FFD700;font-size:13px;margin:10px 0;min-height:40px;background:#000;border-radius:8px;padding:8px}
.playlist{background:#0a1510;border-radius:14px;border:3px solid #000;padding:12px;max-height:380px;overflow-y:auto}
.track{padding:9px 5px;border-bottom:1px dashed #133313;cursor:pointer;color:#7CFC7C;font-size:14px}
.track.active{background:rgba(0,255,100,.35);color:#fff;border-radius:6px}
audio{width:100%;margin-top:12px}
.flagsRow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px;background:#000;border-radius:10px;padding:8px}
.flagItem{text-align:center;font-size:20px;opacity:.55;min-width:38px}
.flagItem.active{opacity:1;transform:scale(1.25);border:2px solid #00ff66;border-radius:8px;background:#0c1a0c}
.flagItem span{display:block;font-size:8px;color:#aaa}
.footer{text-align:center;color:#aaa;font-size:11px;margin-top:10px}
</style>
</head>
<body>
<div class="device">
<div class="top">
<div class="flagBig" id="bigFlag">🇳🇬</div>
<div class="countryName" id="countryName">NIGERIA</div>
<div class="artist" id="now">LARFFAN BELEFU AI RADIO<br>V10 - NAIJA</div>
<div class="bars" id="bars"></div>
</div>
<div class="controls">
<button class="btn" onclick="prev()">◀ PREV</button>
<button class="btn btn-play" onclick="toggle()" id="playBtn">▶ PLAY</button>
<button class="btn" onclick="next()">NEXT ▶</button>
<button class="btn btn-mic" id="micBtn" onclick="startVoice()">🎤 VOICE</button>
</div>
<div class="status" id="status">V10 READY! Say "Track 4" or "Stop"</div>
<div class="playlist"><div id="list"></div>
<audio id="player" controls crossorigin="anonymous" preload="none"></audio>
<div id="embedBox" style="margin-top:10px;display:none"><iframe id="archiveFrame" width="100%" height="120" frameborder="0" allow="autoplay"></iframe></div>
</div>
<div class="flagsRow" id="flagsRow"></div>
<div class="footer">LARFFAN BELEFU • larffanbelefu.com.ng • 18 Tracks • V10</div>
</div>
<script>
const countries=[
{code:"NG",flag:"🇳🇬",name:"NIGERIA"},
{code:"GH",flag:"🇬🇭",name:"GHANA"},
{code:"US",flag:"🇺🇸",name:"USA"},
{code:"GB",flag:"🇬🇧",name:"UK"},
{code:"CA",flag:"🇨🇦",name:"CANADA"},
{code:"ZA",flag:"🇿🇦",name:"SOUTH AFRICA"},
{code:"JM",flag:"🇯🇲",name:"JAMAICA"},
{code:"IN",flag:"🇮🇳",name:"INDIA"}
];
const tracks=[
{ident:"star-zi-o-g-to-god",title:"STAR ZI - O G TO GOD",keys:["star zi"],country:"NG"},
{ident:"wizzy-ns-my-blood",title:"WIZZY NS - MY BLOOD",keys:["wizzy"],country:"NG"},
{ident:"star-zi-my-guy",title:"STAR ZI - MY GUY",keys:["my guy"],country:"NG"},
{ident:"a-message-to-jagaban-amb-gideon-nigeria",title:"AMB GIDEON - MESSAGE TO JAGABAN",keys:["gideon","jagaban","young"],country:"NG"},
{ident:"star-zi-kukerwa",title:"STAR ZI - KUKERWA",keys:["kukerwa"],country:"NG"},
{ident:"rambo-attention-nakamura",title:"RAMBO - ATTENTION NAKAMURA",keys:["rambo","nakamura"],country:"NG"},
{ident:"star-zi-baby-1",title:"STAR ZI - BABY",keys:["baby"],country:"NG"},
{ident:"revelation-17-engkjvn-2-da",title:"REVELATION 17",keys:["revelation"],country:"NG"},
{ident:"aud-20261028-wa-0005-1",title:"AUD - 0005-1",keys:["0005"],country:"NG"},
{ident:"aud-20261027-wa-0024",title:"AUD - 0024",keys:["0024"],country:"NG"},
{ident:"aud-20261027-wa-0025",title:"AUD - 0025",keys:["0025"],country:"NG"},
{ident:"aud-20261028-wa-0000",title:"AUD - 0000",keys:["0000"],country:"NG"},
{ident:"aud-20261028-wa-0001",title:"AUD - 0001",keys:["0001"],country:"NG"},
{ident:"aud-20261028-wa-0002",title:"AUD - 0002",keys:["0002"],country:"NG"},
{ident:"aud-20261028-wa-0003",title:"AUD - 0003",keys:["0003"],country:"NG"},
{ident:"aud-20261028-wa-0004",title:"AUD - 0004",keys:["0004"],country:"NG"},
{ident:"aud-20261028-wa-0005",title:"AUD - 0005",keys:["0005"],country:"NG"},
{ident:"aud-20261028-wa-0006",title:"AUD - 0006",keys:["0006"],country:"NG"}
];
let current=0;
const player=document.getElementById('player'),nowEl=document.getElementById('now'),statusEl=document.getElementById('status'),listEl=document.getElementById('list'),embedBox=document.getElementById('embedBox'),archiveFrame=document.getElementById('archiveFrame'),micBtn=document.getElementById('micBtn'),bigFlag=document.getElementById('bigFlag'),countryName=document.getElementById('countryName'),flagsRow=document.getElementById('flagsRow');
const cache={};
for(let i=0;i<32;i++){let b=document.createElement('div');b.className='bar';b.style.animationDelay=(Math.random()*.6)+'s';document.getElementById('bars').appendChild(b);}
function updateBars(p){document.querySelectorAll('.bar').forEach(b=>b.style.animationPlayState=p?'running':'paused');}
function getCountry(code){return countries.find(c=>c.code===code)||countries[0];}
function renderFlags(){
  flagsRow.innerHTML='';
  countries.forEach(c=>{
    const d=document.createElement('div');d.className='flagItem'+(getCountry(tracks[current].country).code===c.code?' active':'');
    d.innerHTML=c.flag+'<span>'+c.name+'</span>';flagsRow.appendChild(d);
  });
  const cur=getCountry(tracks[current].country);bigFlag.textContent=cur.flag;countryName.textContent=cur.name;
}
function renderList(){
  listEl.innerHTML='';
  tracks.forEach((t,idx)=>{
    const d=document.createElement('div');d.className='track'+(idx===current?' active':'');
    d.textContent='Track '+(idx+1)+' - '+t.title+' '+getCountry(t.country).flag;
    d.onclick=()=>playReal(idx);listEl.appendChild(d);
  });
}
function wordToNumber(w){const m={"one":1,"two":2,"three":3,"four":4,"five":5,"six":6,"seven":7,"eight":8,"nine":9,"ten":10,"eleven":11,"twelve":12,"thirteen":13,"fourteen":14,"fifteen":15,"sixteen":16,"seventeen":17,"eighteen":18,"for":4,"to":2,"too":2,"fore":4};return m[w.toLowerCase()]||null;}
function speak(t){try{if('speechSynthesis' in window){window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-NG';u.rate=1.2;window.speechSynthesis.speak(u);}}catch(e){}}
function stopAll(){player.pause();archiveFrame.src='';embedBox.style.display='none';player.style.display='block';document.getElementById('playBtn').innerText='▶ PLAY';updateBars(false);}
async function getAudioUrl(ident){
  if(cache[ident])return cache[ident];
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),4000);
  try{const r=await fetch('https://archive.org/metadata/'+ident,{signal:ctrl.signal});const meta=await r.json();const files=meta.files||[];let f=files.find(x=>x.name&&/\.(mp3|m4a|ogg|opus)$/i.test(x.name)&&!x.name.includes('_thumb'));if(!f)f=files.find(x=>x.source==='original'&&/\.(mp3|m4a|ogg)$/i.test(x.name));if(f){const url='https://archive.org/download/'+ident+'/'+encodeURIComponent(f.name);cache[ident]=url;return url;}}catch(e){}finally{clearTimeout(timer);}return null;
}
async function playReal(idx){
  stopAll();current=idx;const t=tracks[idx];const label='Track '+(idx+1);const cur=getCountry(t.country);
  nowEl.innerHTML=t.title+'<br><span style="font-size:15px;color:#FFD700">'+label+' / 18 - '+cur.name+'</span>';
  statusEl.innerHTML='Loading: <b>'+label+' - '+t.title+'</b>...';renderList();renderFlags();
  if(typeof gtag!=='undefined'){gtag('event','radio_play',{'track_number':idx+1,'track_title':t.title,'country':cur.code});}
  const url=await getAudioUrl(t.ident);
  if(url){player.src=url;try{await player.play();document.getElementById('playBtn').innerText='❚❚ PAUSE';updateBars(true);statusEl.innerHTML='✅ NOW PLAYING: <b>'+label+' - '+t.title+'</b>';nowEl.innerHTML=t.title+'<br><span style="font-size:15px;color:#00ff66">'+label+' PLAYING - '+cur.name+'</span>';speak(label+" playing");const nxt=tracks[(idx+1)%tracks.length];getAudioUrl(nxt.ident);return;}catch(e){statusEl.innerHTML='Ready: <b>'+label+'</b> - Press PLAY';return;}}
  archiveFrame.src='https://archive.org/embed/'+t.ident+'?autoplay=1';embedBox.style.display='block';player.style.display='none';nowEl.innerHTML=t.title+'<br><span style="font-size:15px;color:#FFD700">'+label+' PLAYING - '+cur.name+'</span>';statusEl.innerHTML='✅ NOW PLAYING: <b>'+label+' - '+t.title+'</b> (Embed)';updateBars(true);speak(label+" playing");
}
function toggle(){if(player.style.display==='none'){stopAll();statusEl.innerHTML='Stopped Embed.';return;}if(player.paused){if(!player.src){playReal(current);return;}player.play();document.getElementById('playBtn').innerText='❚❚ PAUSE';updateBars(true);statusEl.innerHTML='Resumed: Track '+(current+1);}else{stopAll();statusEl.innerHTML='Paused: Track '+(current+1);}}
function next(){playReal((current+1)%tracks.length);}
function prev(){playReal((current-1+tracks.length)%tracks.length);}
function findByName(text){text=text.toLowerCase();for(let i=0;i<tracks.length;i++){if(text.includes(tracks[i].title.toLowerCase()))return i;for(let k of tracks[i].keys){if(text.includes(k))return i;}}return null;}
function handleVoice(raw){
  const text=raw.toLowerCase().trim();statusEl.innerHTML='You said: "<b>'+raw+'</b>"';
  if(text.includes('stop')||text.includes('pause')){stopAll();statusEl.innerHTML='Music Stopped - Track '+(current+1);speak("Stopped");return;}
  if(text.includes('next')){next();return;}
  if(text.includes('previous')||text.includes('prev')||text.includes('back')){prev();return;}
  let m=text.match(/track\s+(\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|for|to|too|fore)/i);
  if(m){let s=m[1].toLowerCase();let n=parseInt(s);if(isNaN(n))n=wordToNumber(s);if(n>=1&&n<=18){playReal(n-1);return;}}
  let only=wordToNumber(text.trim());if(only&&only>=1&&only<=18){playReal(only-1);return;}
  if(text.includes('play')){if(player.paused&&player.src){player.play();document.getElementById('playBtn').innerText='❚❚ PAUSE';updateBars(true);statusEl.innerHTML='Playing Track '+(current+1);}else if(!player.src){playReal(current);}return;}
  let f=findByName(text);if(f!==null){playReal(f);return;}
  if(text.includes('young')){playReal(3);return;}
  statusEl.innerHTML='I hear: "'+raw+'" - Try "Track 4" or "Rambo"';
}
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){statusEl.innerHTML='Voice need Chrome';return;}
  const rec=new SR();rec.lang='en-NG';rec.continuous=false;rec.interimResults=false;
  rec.onstart=()=>{micBtn.classList.add('listening');micBtn.innerText='LISTENING...';statusEl.innerHTML='LISTENING... Say "Track 5" or "Gideon" or "Stop"';};
  rec.onend=()=>{micBtn.classList.remove('listening');micBtn.innerText='🎤 VOICE';};
  rec.onerror=(e)=>{micBtn.classList.remove('listening');micBtn.innerText='🎤 VOICE';statusEl.innerHTML='Voice error: '+e.error+' - Tap again';};
  rec.onresult=(e)=>{handleVoice(e.results[0][0].transcript);};rec.start();
}
renderList();renderFlags();updateBars(false);
player.addEventListener('ended',next);
nowEl.innerHTML=tracks[0].title+'<br><span style="font-size:15px;color:#FFD700">Track 1 / 18 READY - NIGERIA</span>';
statusEl.innerHTML='Ready: <b>Track 1 - '+tracks[0].title+'</b> - Press PLAY';
</script>
</body>
</html>
