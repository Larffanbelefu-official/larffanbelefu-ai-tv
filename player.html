<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LARFFAN BELEFU AI RADIO V3 - DOWNLOAD + FIXED</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@700&display=swap');
body{background:#050505;color:#fff;font-family:'Space Mono',monospace;margin:0;padding:15px;display:flex;justify-content:center}
.device{width:100%;max-width:460px;background:linear-gradient(145deg,#2a2a2a,#151515);border:4px solid #333;border-radius:20px;padding:18px;box-shadow:0 20px 80px rgba(0,0,0,0.9)}
.top{background:#0c1a0c;border-radius:14px;padding:14px;border:3px solid #000;box-shadow:inset 0 0 25px rgba(0,255,100,0.25)}
.artist{font-family:'VT323',monospace;color:#7CFC7C;font-size:22px;line-height:1.1;text-shadow:0 0 10px #00ff66;min-height:60px}
.bars{display:flex;gap:2px;height:55px;margin-top:10px;align-items:flex-end}
.bar{flex:1;background:linear-gradient(to top,#00ff66,#aaffaa);border-radius:2px;animation:bounce 0.7s infinite alternate;animation-play-state:paused}
@keyframes bounce{0%{height:10%}100%{height:100%}}
.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0}
.btn{background:#222;border:2px solid #444;border-radius:10px;color:#ccc;padding:9px 10px;font-weight:700;font-size:11px;cursor:pointer}
.btn-play{background:#00ff66;color:#000;border-color:#00cc55;font-size:12px}
.btn-mic{background:#FFD700;color:#000;border-color:#ffaa00}
.btn-dl{background:#FF4500;color:#fff;border-color:#ff0000;font-size:12px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.status{text-align:center;color:#FFD700;font-size:11px;margin:8px 0;min-height:18px;word-break:break-all}
.playlist{background:#0a1510;border-radius:14px;border:3px solid #000;padding:12px;max-height:450px;overflow-y:auto}
.track{display:flex;justify-content:space-between;font-family:'VT323',monospace;font-size:14px;color:#7CFC7C;padding:7px 4px;border-bottom:1px dashed #133313;cursor:pointer}
.track.active{background:rgba(0,255,100,0.3);color:#fff;border-radius:6px}
audio{width:100%;margin-top:10px}
.footer{text-align:center;color:#555;font-size:9px;margin-top:10px}
.loading{color:#00ff66;animation:blink 1s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0.3}}
.dl-info{font-size:10px;color:#aaa;text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="device">
<div class="top">
<div class="artist" id="now">LARFFAN BELEFU AI RADIO V3<br>18 TRACKS + DOWNLOAD FIXED!</div>
<div class="bars" id="bars"></div>
</div>

<div class="controls">
<button class="btn" onclick="prev()">◀ PREV</button>
<button class="btn btn-play" onclick="toggle()" id="playBtn">▶ PLAY</button>
<button class="btn" onclick="next()">NEXT ▶</button>
<button class="btn" id="shuffleBtn" onclick="toggleShuffle()">🔀 SHUFFLE</button>
<button class="btn btn-mic" onclick="startVoice()">🎤 VOICE</button>
<button class="btn btn-dl" onclick="downloadCurrent()">⬇️ DOWNLOAD THIS TRACK</button>
</div>

<div class="status" id="status">V3 Ready! Track 4 fixed + Download added!</div>
<div class="dl-info" id="dlInfo"></div>

<div class="playlist">
<div id="list"></div>
<audio id="player" controls crossorigin="anonymous"></audio>
<div id="embedBox" style="margin-top:10px;display:none"><iframe id="archiveFrame" width="100%" height="120" frameborder="0"></iframe></div>
</div>

<div class="footer">LARFFAN BELEFU • larffanbelefu.com.ng • 18 TRACKS • DOWNLOAD OK!</div>
</div>

<script>
const tracks = [
{ident:"star-zi-o-g-to-god", title:"01 STAR ZI - O G TO GOD"},
{ident:"wizzy-ns-my-blood", title:"02 WIZZY NS - MY BLOOD"},
{ident:"star-zi-my-guy", title:"03 STAR ZI - MY GUY"},
{ident:"a-message-to-jagaban-amb-gideon-nigeria", title:"04 AMB GIDEON - MESSAGE TO JAGABAN"},
{ident:"star-zi-kukerwa", title:"05 STAR ZI - KUKERWA"},
{ident:"rambo-attention-nakamura", title:"06 RAMBO - ATTENTION NAKAMURA"},
{ident:"star-zi-baby-1", title:"07 STAR ZI - BABY"},
{ident:"revelation-17-engkjvn-2-da", title:"08 REVELATION 17"},
{ident:"aud-20261028-wa-0005-1", title:"09 AUD - 0005-1"},
{ident:"aud-20261027-wa-0024", title:"10 AUD - 0024"},
{ident:"aud-20261027-wa-0025", title:"11 AUD - 0025"},
{ident:"aud-20261028-wa-0000", title:"12 AUD - 0000"},
{ident:"aud-20261028-wa-0001", title:"13 AUD - 0001"},
{ident:"aud-20261028-wa-0002", title:"14 AUD - 0002"},
{ident:"aud-20261028-wa-0003", title:"15 AUD - 0003"},
{ident:"aud-20261028-wa-0004", title:"16 AUD - 0004"},
{ident:"aud-20261028-wa-0005", title:"17 AUD - 0005"},
{ident:"aud-20261028-wa-0006", title:"18 AUD - 0006"}
];
let current=0, shuffle=false, order=tracks.map((_,i)=>i), currentDownloadUrl='';
const player=document.getElementById('player');
const nowEl=document.getElementById('now');
const statusEl=document.getElementById('status');
const dlInfoEl=document.getElementById('dlInfo');
const listEl=document.getElementById('list');
const embedBox=document.getElementById('embedBox');
const archiveFrame=document.getElementById('archiveFrame');

for(let i=0;i<28;i++){let b=document.createElement('div');b.className='bar';b.style.animationDelay=(Math.random()*0.7)+'s';document.getElementById('bars').appendChild(b);}
function updateBars(p){document.querySelectorAll('.bar').forEach(b=>b.style.animationPlayState=p?'running':'paused');}
function renderList(){
  listEl.innerHTML='';
  order.forEach((realIdx,displayIdx)=>{
    const t=tracks[realIdx];
    const div=document.createElement('div');
    div.className='track'+(realIdx===current?' active':'');
    div.innerHTML='<span>'+(displayIdx+1)+'. '+t.title+'</span><span>▶ TRACK '+(realIdx+1)+'</span>';
    div.onclick=()=>playReal(realIdx);
    listEl.appendChild(div);
  });
}

async function playReal(idx){
  current=idx;
  const t=tracks[idx];
  nowEl.innerHTML=t.title+'<br><span style="font-size:16px;color:#FFD700">TRACK '+(idx+1)+' / 18 <span class="loading">LOADING...</span></span>';
  statusEl.innerText='Finding file for '+t.ident+'...';
  updateBars(false); renderList(); embedBox.style.display='none'; player.style.display='block';
  try{
    const metaRes = await fetch('https://archive.org/metadata/'+t.ident);
    const meta = await metaRes.json();
    const files = meta.files || [];
    let audioFile = files.find(f=>f.name && (f.name.toLowerCase().endsWith('.mp3') || f.name.toLowerCase().endsWith('.m4a') || f.name.toLowerCase().endsWith('.ogg') || f.name.toLowerCase().endsWith('.opus')) && !f.name.includes('_thumb') && !f.name.includes('spectrogram') && !f.name.includes('.jpg') && !f.name.includes('.png'));
    if(!audioFile) audioFile = files.find(f=>f.source==='original');
    if(audioFile){
      const url = 'https://archive.org/download/'+t.ident+'/'+encodeURIComponent(audioFile.name);
      currentDownloadUrl = url;
      player.src=url; await player.play();
      document.getElementById('playBtn').innerText='❚❚ PAUSE'; updateBars(true);
      statusEl.innerText='✅ Now Playing: '+t.title;
      dlInfoEl.innerText='Download file: '+audioFile.name+' - Click DOWNLOAD button!';
      nowEl.innerHTML=t.title+'<br><span style="font-size:16px;color:#00ff66">TRACK '+(idx+1)+' PLAYING • DOWNLOAD READY</span>';
      return;
    } else { throw new Error('No file'); }
  } catch(e){
    currentDownloadUrl = 'https://archive.org/details/'+t.ident;
    statusEl.innerText='Embed mode - download go still work!';
    dlInfoEl.innerText='Click DOWNLOAD to go Archive page to download';
    archiveFrame.src='https://archive.org/embed/'+t.ident+'?autoplay=1'; embedBox.style.display='block';
    player.style.display='none'; nowEl.innerHTML=t.title+'<br><span style="font-size:16px;color:#FFD700">TRACK '+(idx+1)+' - EMBED + DOWNLOAD</span>'; updateBars(true);
  }
}

function downloadCurrent(){
  if(!currentDownloadUrl){statusEl.innerText='Play a track first before downloading!';return;}
  const t=tracks[current];
  if(currentDownloadUrl.includes('/details/')){
    window.open(currentDownloadUrl,'_blank');
    statusEl.innerText='Opening Archive page for download: '+t.title;
  } else {
    const a=document.createElement('a'); a.href=currentDownloadUrl; a.download=t.title+'.mp3'; a.target='_blank'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    statusEl.innerText='⬇️ Downloading: '+t.title+' - Check your Downloads folder!';
  }
}
function toggle(){if(player.style.display==='none'){statusEl.innerText='Use embed controls';return;} if(player.paused){player.play();document.getElementById('playBtn').innerText='❚❚ PAUSE';updateBars(true);}else{player.pause();document.getElementById('playBtn').innerText='▶ PLAY';updateBars(false);}}
function next(){let pos=order.indexOf(current);let np=(pos+1)%order.length;playReal(order[np]);}
function prev(){let pos=order.indexOf(current);let pp=(pos-1+order.length)%order.length;playReal(order[pp]);}
function toggleShuffle(){shuffle=!shuffle;if(shuffle){order=[...order].sort(()=>Math.random()-0.5);document.getElementById('shuffleBtn').innerText='🔀 SHUFFLE ON';}else{order=tracks.map((_,i)=>i);document.getElementById('shuffleBtn').innerText='🔀 SHUFFLE OFF';}renderList();}
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){statusEl.innerText='Use Chrome for voice';return;}
  const rec=new SR(); rec.lang='en-NG';
  rec.onstart=()=>{statusEl.innerText='🎤 Listening... "Take me to track 5"';};
  rec.onresult=(e)=>{
    const text=e.results[0][0].transcript.toLowerCase();
    statusEl.innerText='You said: "'+text+'"';
    let m=text.match(/track\s+(\d+)/);
    if(m){let num=parseInt(m[1]);if(num>=1&&num<=tracks.length){playReal(num-1);return;}}
    if(text.includes('rambo')){playReal(5);return;}
    if(text.includes('gideon')||text.includes('jagaban')){playReal(3);return;}
    if(text.includes('download')){downloadCurrent();return;}
    if(text.includes('next')){next();return;}
    if(text.includes('previous')){prev();return;}
  }; rec.start();
}
renderList(); updateBars(false); player.addEventListener('ended',next);
playReal(0);
</script>
</body>
</html>
